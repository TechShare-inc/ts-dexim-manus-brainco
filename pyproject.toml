[project]
name = "dexim-manus-brainco"
version = "0.1.0"
description = "DexImitate umbrella CLI — real-time Manus-to-BrainCo teleoperation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dexim-cli-common>=0.1.0",
    "readchar>=4.0",
    "rich-click>=1.8",
]

[project.scripts]
dexim = "dexim_manus_brainco.cli:main"

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dexim_manus_brainco"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
