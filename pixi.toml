[workspace]
authors = ["haoyan.li <haoyan.li@techshare.co.jp>"]
channels = ["conda-forge"]
name = "dexim-manus-brainco"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
manus-build = { cmd = "pixi run build", cwd = "packages/manus-sdk-python" }

[dependencies]
python = "3.10.*"
pinocchio = ">=3.9.0,<4"
pytorch-cpu = ">=2.2.1,<2.11.0"

# Required to build manus-sdk-python (C++ extension) in editable mode
cmake = ">=3.15"
ninja = ">=1.10"
nanobind = ">=1.3.2"
scikit-build-core = ">=0.3.3"
uv = ">=0.5"
# lerobot==0.4.4 requires packaging>=24.2,<26.0; pin conda packaging accordingly
packaging = ">=24.2,<26"
# lerobot==0.4.4 requires setuptools>=71.0.0,<81.0.0
setuptools = ">=71.0,<81"
# lerobot==0.4.4 → datasets>=4.0.0 → fsspec[http]<=2026.2.0; conda resolves 2026.3.0 which breaks it
fsspec = "<=2026.2.0"

[pypi-dependencies]
dexim-cli-common = { path = "packages/dexim-cli-common", editable = true }
dexim-core = { path = "packages/dexim-core", editable = true }
dexim-manus = { path = "packages/dexim-manus", editable = true }
dexim-brainco = { path = "packages/dexim-brainco", editable = true }
dexim-visualizer = { path = "packages/dexim-visualizer", editable = true }
dexim-realsense = { path = "packages/dexim-realsense", editable = true }
manus-sdk-python = { path = "packages/manus-sdk-python" }
dexim-recorder = { path = "packages/dexim-recorder", editable = true }
dexim-manus-brainco = { path = ".", editable = true }
pytest = ">=8.0"
pytest-cov = ">=5.0"
scipy-stubs = ">=1.15.3.0, <2"

[feature.hw.pypi-dependencies]
dexim-realsense = { path = "packages/dexim-realsense", editable = true, extras = ["hw"] }
dexim-brainco = { path = "packages/dexim-brainco", editable = true, extras = ["hardware"] }

[environments]
hw = { features = ["hw"], solve-group = "default" }
